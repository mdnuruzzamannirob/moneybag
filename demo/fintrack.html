<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyBag — Personal Finance Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =============================================================
       ✨ MAVIS DESIGN SYSTEM v2.0 — MoneyBag Edition
       ============================================================= */
    :root, [data-theme="light"] {
      --color-primary:        #6366F1;
      --color-primary-hover:  #4F46E5;
      --color-primary-active: #4338CA;
      --color-primary-soft:   #EEF2FF;
      --color-primary-fg:     #FFFFFF;

      --color-accent:         #EC4899;
      --color-accent-soft:    #FCE7F3;

      --color-bg:             #FAFAFB;
      --color-surface:        #FFFFFF;
      --color-surface-2:      #F4F4F7;
      --color-surface-3:      #ECECF1;
      --color-overlay:        rgba(15, 23, 42, 0.55);

      --color-text:           #0F172A;
      --color-text-muted:     #64748B;
      --color-text-subtle:    #94A3B8;
      --color-text-inverse:   #FFFFFF;

      --color-border:         #E2E8F0;
      --color-border-strong:  #CBD5E1;
      --color-border-focus:   #6366F1;

      --color-success:        #10B981;
      --color-success-soft:   #D1FAE5;
      --color-warning:        #F59E0B;
      --color-warning-soft:   #FEF3C7;
      --color-danger:         #EF4444;
      --color-danger-soft:    #FEE2E2;
      --color-info:           #3B82F6;
      --color-info-soft:      #DBEAFE;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.10), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-2xl:0 25px 50px -12px rgba(15, 23, 42, 0.20);
      --shadow-glow: 0 0 0 4px rgba(99, 102, 241, 0.18);
      --shadow-inner: inset 0 2px 4px rgba(15, 23, 42, 0.04);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      --font-display: 'Inter', -apple-system, sans-serif;

      --text-xs:   0.75rem;   --text-sm:   0.875rem;  --text-base: 1rem;
      --text-lg:   1.125rem;  --text-xl:   1.25rem;   --text-2xl:  1.5rem;
      --text-3xl:  1.875rem;  --text-4xl:  2.25rem;   --text-5xl:  3rem;

      --leading-tight:  1.2;  --leading-normal: 1.5;  --leading-loose:  1.75;
      --tracking-tight:  -0.02em;  --tracking-normal: 0;  --tracking-wide:   0.05em;

      --space-0: 0; --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem; --space-20: 5rem; --space-24: 6rem;

      --radius-sm: 0.25rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
      --radius-xl: 1rem; --radius-2xl: 1.5rem; --radius-3xl: 2rem; --radius-full: 9999px;

      --border-thin:   1px solid var(--color-border);
      --border-medium: 1px solid var(--color-border-strong);
      --border-thick:  2px solid var(--color-border-strong);

      --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out:     cubic-bezier(0, 0, 0.2, 1);
      --ease-in:      cubic-bezier(0.4, 0, 1, 1);
      --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --duration-fast:   150ms;
      --duration-normal: 250ms;
      --duration-slow:   400ms;

      --container-sm: 640px;  --container-md: 768px;  --container-lg: 1024px;
      --container-xl: 1280px; --container-2xl: 1536px;

      --sidebar-w: 260px;
    }

    [data-theme="dark"] {
      --color-primary:        #818CF8;
      --color-primary-hover:  #A5B4FC;
      --color-primary-active: #C7D2FE;
      --color-primary-soft:   #1E1B4B;
      --color-primary-fg:     #0B0B12;
      --color-accent:         #F472B6;
      --color-accent-soft:    #500724;
      --color-bg:             #0A0A0F;
      --color-surface:        #13131A;
      --color-surface-2:      #1C1C26;
      --color-surface-3:      #262633;
      --color-overlay:        rgba(0, 0, 0, 0.7);
      --color-text:           #F1F5F9;
      --color-text-muted:     #94A3B8;
      --color-text-subtle:    #64748B;
      --color-text-inverse:   #0F172A;
      --color-border:         #262633;
      --color-border-strong:  #38384A;
      --color-border-focus:   #818CF8;
      --color-success:        #34D399;  --color-success-soft:   #064E3B;
      --color-warning:        #FBBF24;  --color-warning-soft:   #451A03;
      --color-danger:         #F87171;  --color-danger-soft:    #450A0A;
      --color-info:           #60A5FA;  --color-info-soft:      #172554;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --shadow-2xl:0 25px 50px -12px rgba(0, 0, 0, 0.8);
      --shadow-glow: 0 0 0 4px rgba(129, 140, 248, 0.25), 0 0 24px rgba(129, 140, 248, 0.2);
      --shadow-inner: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* ============== Base ============== */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background var(--duration-normal) var(--ease-default), color var(--duration-normal) var(--ease-default);
      min-height: 100vh;
    }
    code, pre, kbd { font-family: var(--font-mono); }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    h1, h2, h3, h4, h5 { margin: 0; letter-spacing: var(--tracking-tight); }
    p { margin: 0; }

    /* Hide scrollbar utility */
    .scroll-y { overflow-y: auto; }
    .scroll-y::-webkit-scrollbar { width: 6px; }
    .scroll-y::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 3px; }

    /* ============== Custom Select (replaces raw <select>) ============== */
    .select-wrap { position: relative; width: 100%; }
    .select-wrap .select-trigger {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-2);
      width: 100%; padding: var(--space-2) var(--space-3);
      background: var(--color-surface);
      color: var(--color-text);
      border: var(--border-thin); border-radius: var(--radius-md);
      font-size: var(--text-sm); text-align: left;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .select-wrap .select-trigger:hover { border-color: var(--color-border-strong); }
    .select-wrap .select-trigger.open { border-color: var(--color-border-focus); box-shadow: var(--shadow-glow); }
    .select-wrap .select-trigger .chev {
      width: 16px; height: 16px; color: var(--color-text-muted); transition: transform var(--duration-fast) var(--ease-default);
    }
    .select-wrap .select-trigger.open .chev { transform: rotate(180deg); }
    .select-wrap .select-menu {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xl);
      max-height: 240px; overflow-y: auto;
      padding: 4px;
      display: none;
      animation: selectFade 0.15s var(--ease-default);
    }
    .select-wrap .select-menu.open { display: block; }
    @keyframes selectFade { from { opacity: 0; transform: translateY(-4px);} to {opacity:1; transform: translateY(0);} }
    .select-wrap .select-option {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      cursor: pointer;
      color: var(--color-text);
      transition: background var(--duration-fast) var(--ease-default);
    }
    .select-wrap .select-option:hover { background: var(--color-surface-2); }
    .select-wrap .select-option.selected { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
    .select-wrap .select-option .opt-icon { font-size: 16px; }

    /* ============== App Shell ============== */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    /* ============== Sidebar ============== */
    .sidebar {
      background: var(--color-surface);
      border-right: var(--border-thin);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
      z-index: 40;
    }
    .sidebar-header {
      padding: var(--space-5);
      display: flex; align-items: center; gap: var(--space-3);
      border-bottom: var(--border-thin);
    }
    .sidebar-logo {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: grid; place-items: center; color: white; font-weight: 800;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }
    .sidebar-brand { font-weight: 700; font-size: var(--text-base); letter-spacing: var(--tracking-tight); }
    .sidebar-tag { font-size: var(--text-xs); color: var(--color-text-muted); }

    .sidebar-search { margin: var(--space-4); position: relative; }
    .sidebar-search input {
      width: 100%; padding: var(--space-2) var(--space-3) var(--space-2) var(--space-8);
      background: var(--color-surface-2);
      border: var(--border-thin);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .sidebar-search input:focus { border-color: var(--color-border-focus); box-shadow: var(--shadow-glow); }
    .sidebar-search svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--color-text-muted);
    }
    .sidebar-search kbd {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 10px; padding: 2px 6px;
      background: var(--color-surface); border: var(--border-thin);
      border-radius: var(--radius-sm); color: var(--color-text-muted);
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 0 var(--space-3) var(--space-3); }
    .nav-section { margin-bottom: var(--space-5); }
    .nav-label {
      font-size: var(--text-xs); font-weight: 600;
      color: var(--color-text-subtle);
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0 var(--space-3); margin-bottom: var(--space-2);
    }
    .nav-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      font-size: var(--text-sm); font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-default);
      position: relative;
      border: none; background: transparent; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--color-surface-2); color: var(--color-text); }
    .nav-item.active {
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-weight: 600;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item .count {
      margin-left: auto;
      font-size: var(--text-xs);
      background: var(--color-surface-2); color: var(--color-text-muted);
      padding: 2px 8px; border-radius: var(--radius-full);
      font-weight: 600;
    }
    .nav-item.active .count { background: var(--color-primary); color: var(--color-primary-fg); }

    .sidebar-footer {
      padding: var(--space-4);
      border-top: var(--border-thin);
      display: flex; align-items: center; gap: var(--space-3);
    }
    .avatar {
      width: 36px; height: 36px; border-radius: var(--radius-full);
      display: grid; place-items: center;
      font-weight: 700; font-size: var(--text-sm);
      flex-shrink: 0;
    }
    .avatar-sm { width: 28px; height: 28px; font-size: var(--text-xs); }
    .avatar-lg { width: 48px; height: 48px; font-size: var(--text-base); }
    .avatar-xl { width: 64px; height: 64px; font-size: var(--text-lg); }
    .avatar-text { background: var(--color-primary-soft); color: var(--color-primary); }
    .avatar-accent { background: var(--color-accent-soft); color: var(--color-accent); }
    .avatar-success { background: var(--color-success-soft); color: var(--color-success); }
    .avatar-warning { background: var(--color-warning-soft); color: var(--color-warning); }
    .avatar-info { background: var(--color-info-soft); color: var(--color-info); }

    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ============== Main ============== */
    .main { display: flex; flex-direction: column; min-width: 0; }

    /* ============== Topbar ============== */
    .topbar {
      height: 64px;
      background: var(--color-surface);
      border-bottom: var(--border-thin);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-6);
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--color-surface) 80%, transparent);
      gap: var(--space-3);
    }
    .breadcrumb { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); min-width: 0; }
    .breadcrumb-current { color: var(--color-text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb svg { width: 14px; height: 14px; flex-shrink: 0; }

    .topbar-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: transparent; border: var(--border-thin);
      display: grid; place-items: center;
      color: var(--color-text-muted);
      position: relative;
      transition: all var(--duration-fast) var(--ease-default);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--color-surface-2); color: var(--color-text); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn .dot-indicator {
      position: absolute; top: 8px; right: 8px;
      width: 8px; height: 8px; border-radius: var(--radius-full);
      background: var(--color-danger); border: 2px solid var(--color-surface);
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-success); margin-right: 6px; vertical-align: middle; }

    /* Compact theme toggle (single icon button that swaps) */
    .theme-toggle {
      display: inline-flex; align-items: center;
    }
    .theme-toggle-btn {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: var(--color-surface-2);
      border: var(--border-thin);
      display: grid; place-items: center;
      color: var(--color-text-muted);
      transition: all var(--duration-fast) var(--ease-default);
    }
    .theme-toggle-btn:hover { background: var(--color-surface-3); color: var(--color-text); }
    .theme-toggle-btn svg { width: 18px; height: 18px; }
    .theme-toggle-btn .icon-sun { display: block; }
    .theme-toggle-btn .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle-btn .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle-btn .icon-moon { display: block; }

    .pill-group {
      display: inline-flex; padding: 4px; gap: 4px;
      background: var(--color-surface-2);
      border-radius: var(--radius-full);
      border: var(--border-thin);
    }
    .pill-group button {
      border: none; background: transparent;
      padding: 6px 12px; border-radius: var(--radius-full);
      font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-muted);
      transition: all var(--duration-fast) var(--ease-default);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill-group button.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }
    .pill-group svg { width: 14px; height: 14px; }

    /* ============== Content ============== */
    .content { padding: var(--space-6) var(--space-8) var(--space-12); max-width: 1600px; width: 100%; margin: 0 auto; }
    .page { display: none; animation: fadeIn 0.3s var(--ease-default); }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: var(--space-6); gap: var(--space-4);
      flex-wrap: wrap;
    }
    .page-header > div:first-child { flex: 1; min-width: 0; }
    .page-title { word-break: break-word; }
    .page-title { font-size: var(--text-3xl); font-weight: 700; margin: 0; letter-spacing: var(--tracking-tight); }
    .page-desc { color: var(--color-text-muted); margin: 4px 0 0; font-size: var(--text-sm); }
    .page-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

    /* ============== Buttons ============== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm); font-weight: 600;
      border: 1px solid transparent;
      transition: all var(--duration-fast) var(--ease-default);
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--color-primary); color: var(--color-primary-fg); box-shadow: var(--shadow-sm); }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
    .btn-secondary:hover:not(:disabled) { background: var(--color-surface-2); border-color: var(--color-border-strong); }
    .btn-ghost { background: transparent; color: var(--color-text); }
    .btn-ghost:hover:not(:disabled) { background: var(--color-surface-2); }
    .btn-danger { background: var(--color-danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #DC2626; }
    .btn-success { background: var(--color-success); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-sm { padding: 6px var(--space-3); font-size: var(--text-xs); }
    .btn-lg { padding: 12px var(--space-6); font-size: var(--text-base); }
    .btn-block { width: 100%; }
    .btn-icon { padding: 0; width: 36px; }

    /* ============== Card ============== */
    .card {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .card-header {
      padding: var(--space-5) var(--space-6);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: var(--border-thin);
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .card-title { font-size: var(--text-base); font-weight: 600; margin: 0; }
    .card-subtitle { font-size: var(--text-xs); color: var(--color-text-muted); margin: 2px 0 0; }
    .card-body { padding: var(--space-6); }
    .card-footer {
      padding: var(--space-4) var(--space-6);
      border-top: var(--border-thin);
      background: var(--color-surface-2);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* ============== KPI Cards ============== */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
    .kpi {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      transition: all var(--duration-fast) var(--ease-default);
      position: relative; overflow: hidden;
    }
    .kpi:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .kpi-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .kpi-label { font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 500; }
    .kpi-icon { width: 36px; height: 36px; border-radius: var(--radius-md); display: grid; place-items: center; }
    .kpi-icon svg { width: 18px; height: 18px; }
    .kpi-icon-primary { background: var(--color-primary-soft); color: var(--color-primary); }
    .kpi-icon-success { background: var(--color-success-soft); color: var(--color-success); }
    .kpi-icon-warning { background: var(--color-warning-soft); color: var(--color-warning); }
    .kpi-icon-danger  { background: var(--color-danger-soft);  color: var(--color-danger); }
    .kpi-icon-info    { background: var(--color-info-soft);    color: var(--color-info); }
    .kpi-icon-accent  { background: var(--color-accent-soft);  color: var(--color-accent); }
    .kpi-value { font-size: var(--text-3xl); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: 1.1; }
    .kpi-trend { display: flex; align-items: center; gap: 4px; font-size: var(--text-xs); font-weight: 600; margin-top: var(--space-2); }
    .kpi-trend-up { color: var(--color-success); }
    .kpi-trend-down { color: var(--color-danger); }

    /* ============== Layouts ============== */
    .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-4); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
    .grid-2-equal { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }

    /* ============== Table ============== */
    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); min-width: 600px; }
    .table th {
      text-align: left; padding: var(--space-3) var(--space-4);
      font-size: var(--text-xs); font-weight: 600;
      color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em;
      background: var(--color-surface-2);
      border-bottom: var(--border-thin);
      white-space: nowrap;
    }
    .table td { padding: var(--space-4); border-bottom: var(--border-thin); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: var(--color-surface-2); }
    .table .cell-strong { font-weight: 600; }
    .table .cell-muted { color: var(--color-text-muted); font-size: var(--text-xs); }
    .table .cell-actions { display: flex; gap: var(--space-1); justify-content: flex-end; }

    .table-toolbar {
      padding: var(--space-4) var(--space-5);
      display: flex; align-items: center; gap: var(--space-3);
      border-bottom: var(--border-thin);
      flex-wrap: wrap;
    }
    .table-toolbar .select-wrap { flex: 0 0 auto; width: auto; min-width: 160px; }
    .table-toolbar .search-input { flex: 1; min-width: 180px; max-width: 320px; }

    .search-input { position: relative; }
    .search-input input {
      width: 100%; padding: 8px 12px 8px 36px;
      background: var(--color-surface-2);
      border: var(--border-thin); border-radius: var(--radius-md);
      color: var(--color-text); font-size: var(--text-sm);
      font-family: var(--font-sans); outline: none;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .search-input input:focus { border-color: var(--color-border-focus); background: var(--color-surface); box-shadow: var(--shadow-glow); }
    .search-input svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-text-muted); }

    .tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--color-surface-2); border-radius: var(--radius-md); border: var(--border-thin); }
    .tabs button {
      padding: 6px 12px; border: none; background: transparent;
      font-size: var(--text-xs); font-weight: 500; color: var(--color-text-muted);
      border-radius: var(--radius-sm);
      transition: all var(--duration-fast) var(--ease-default);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tabs button.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }
    .tabs button:hover:not(.active) { color: var(--color-text); }

    /* ============== Badges ============== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: var(--radius-full);
      font-size: var(--text-xs); font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge svg { width: 10px; height: 10px; }
    .badge-success { background: var(--color-success-soft); color: var(--color-success); }
    .badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
    .badge-danger  { background: var(--color-danger-soft);  color: var(--color-danger); }
    .badge-info    { background: var(--color-info-soft);    color: var(--color-info); }
    .badge-neutral { background: var(--color-surface-2); color: var(--color-text-muted); border-color: var(--color-border); }
    .badge-primary { background: var(--color-primary-soft); color: var(--color-primary); }

    /* ============== Forms ============== */
    .field { display: flex; flex-direction: column; gap: var(--space-2); }
    .label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text); }
    .hint  { font-size: var(--text-xs); color: var(--color-text-muted); }
    .input, .textarea {
      width: 100%; padding: var(--space-2) var(--space-3);
      background: var(--color-surface);
      color: var(--color-text);
      border: var(--border-thin); border-radius: var(--radius-md);
      font-family: var(--font-sans); font-size: var(--text-sm);
      outline: none; transition: all var(--duration-fast) var(--ease-default);
    }
    .input:focus, .textarea:focus { border-color: var(--color-border-focus); box-shadow: var(--shadow-glow); }
    .input::placeholder, .textarea::placeholder { color: var(--color-text-subtle); }
    .input-error { border-color: var(--color-danger); }
    .input-error:focus { box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
    .textarea { resize: vertical; min-height: 100px; }
    .input-with-icon { position: relative; }
    .input-with-icon .input { padding-left: 40px; }
    .input-with-icon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-text-muted); }
    .input-with-icon .toggle-eye { right: 8px; left: auto; cursor: pointer; padding: 6px; border-radius: var(--radius-sm); }
    .input-with-icon .toggle-eye:hover { background: var(--color-surface-2); }
    .field-error { font-size: var(--text-xs); color: var(--color-danger); }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--color-surface-3); border-radius: var(--radius-full);
      transition: background var(--duration-fast) var(--ease-default);
    }
    .toggle-slider::before {
      position: absolute; content: ""; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background: white; border-radius: var(--radius-full);
      transition: transform var(--duration-fast) var(--ease-default);
      box-shadow: var(--shadow-sm);
    }
    .toggle input:checked + .toggle-slider { background: var(--color-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Checkbox */
    .checkbox { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; user-select: none; }
    .checkbox input { display: none; }
    .checkbox-box {
      width: 18px; height: 18px; border: var(--border-medium); border-radius: var(--radius-sm);
      background: var(--color-surface); display: grid; place-items: center;
      transition: all var(--duration-fast) var(--ease-default); flex-shrink: 0;
    }
    .checkbox-box svg { width: 12px; height: 12px; color: white; opacity: 0; }
    .checkbox input:checked + .checkbox-box { background: var(--color-primary); border-color: var(--color-primary); }
    .checkbox input:checked + .checkbox-box svg { opacity: 1; }

    /* Radio */
    .radio { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; }
    .radio input { display: none; }
    .radio-circle {
      width: 18px; height: 18px; border: var(--border-medium); border-radius: var(--radius-full);
      background: var(--color-surface); display: grid; place-items: center;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .radio-circle::after { content: ""; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-primary); transform: scale(0); transition: transform var(--duration-fast) var(--ease-spring); }
    .radio input:checked + .radio-circle { border-color: var(--color-primary); }
    .radio input:checked + .radio-circle::after { transform: scale(1); }

    /* ============== Chart ============== */
    .chart-wrap { padding: var(--space-5) var(--space-6); }
    .chart-legend { display: flex; gap: var(--space-4); flex-wrap: wrap; }
    .chart-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-muted); }
    .chart-legend-item .swatch { width: 10px; height: 10px; border-radius: 3px; }
    .chart-svg { width: 100%; height: auto; display: block; }

    /* ============== Activity Feed ============== */
    .activity { display: flex; flex-direction: column; }
    .activity-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      border-bottom: var(--border-thin);
      transition: background var(--duration-fast) var(--ease-default);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-item:hover { background: var(--color-surface-2); }
    .activity-icon {
      width: 32px; height: 32px; border-radius: var(--radius-full);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .activity-icon svg { width: 14px; height: 14px; }
    .activity-content { flex: 1; min-width: 0; }
    .activity-text { font-size: var(--text-sm); line-height: 1.5; }
    .activity-text strong { font-weight: 600; }
    .activity-time { font-size: var(--text-xs); color: var(--color-text-subtle); margin-top: 2px; }

    /* ============== Progress Bar ============== */
    .progress { height: 8px; background: var(--color-surface-3); border-radius: var(--radius-full); overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--color-primary), var(--color-accent)); border-radius: var(--radius-full); transition: width var(--duration-normal) var(--ease-default); }
    .progress-bar-success { background: var(--color-success); }
    .progress-bar-warning { background: var(--color-warning); }
    .progress-bar-danger  { background: var(--color-danger); }

    /* ============== Donut ============== */
    .donut-wrap { display: flex; align-items: center; gap: var(--space-6); }
    .donut-svg { width: 140px; height: 140px; flex-shrink: 0; }
    .donut-list { flex: 1; display: flex; flex-direction: column; gap: var(--space-3); }
    .donut-list-item { display: flex; align-items: center; gap: var(--space-3); }
    .donut-list-item .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .donut-list-item .name { flex: 1; font-size: var(--text-sm); }
    .donut-list-item .pct { font-weight: 600; font-size: var(--text-sm); }

    /* ============== Bar chart ============== */
    .bar-chart { display: flex; align-items: flex-end; gap: var(--space-2); height: 200px; padding: var(--space-4) 0; }
    .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 0; }
    .bar-pair { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
    .bar { width: 14px; border-radius: 4px 4px 0 0; transition: all var(--duration-fast) var(--ease-default); cursor: pointer; min-height: 4px; }
    .bar:hover { opacity: 0.8; }
    .bar.income { background: var(--color-success); }
    .bar.expense { background: var(--color-danger); }
    .bar-label { font-size: var(--text-xs); color: var(--color-text-muted); }

    /* ============== Pagination ============== */
    .pagination { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-top: var(--border-thin); flex-wrap: wrap; gap: var(--space-3); }
    .page-btn {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      border: var(--border-thin); background: var(--color-surface);
      color: var(--color-text); font-size: var(--text-sm);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .page-btn:hover:not(:disabled) { background: var(--color-surface-2); }
    .page-btn.active { background: var(--color-primary); color: var(--color-primary-fg); border-color: var(--color-primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-info { font-size: var(--text-xs); color: var(--color-text-muted); }

    /* ============== Misc ============== */
    .empty { text-align: center; padding: var(--space-12) var(--space-6); color: var(--color-text-muted); }
    .empty svg { width: 48px; height: 48px; opacity: 0.4; margin-bottom: var(--space-3); }
    .empty h3 { font-size: var(--text-base); font-weight: 600; color: var(--color-text); margin: 0 0 var(--space-2); }
    .empty p { margin: 0; font-size: var(--text-sm); }
    .divider { height: 1px; background: var(--color-border); margin: var(--space-4) 0; border: none; }
    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: var(--space-1); } .gap-2 { gap: var(--space-2); } .gap-3 { gap: var(--space-3); } .gap-4 { gap: var(--space-4); } .gap-6 { gap: var(--space-6); }
    .mt-2 { margin-top: var(--space-2); } .mt-4 { margin-top: var(--space-4); } .mt-6 { margin-top: var(--space-6); }
    .mb-2 { margin-bottom: var(--space-2); } .mb-4 { margin-bottom: var(--space-4); } .mb-6 { margin-bottom: var(--space-6); }
    .text-muted { color: var(--color-text-muted); }
    .text-sm { font-size: var(--text-sm); }
    .text-xs { font-size: var(--text-xs); }
    .text-lg { font-size: var(--text-lg); }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }

    /* ============== Mobile ============== */
    .mobile-menu { display: none; }
    .sidebar-backdrop { display: none; }
    @media (max-width: 1024px) {
      .grid-2, .grid-3, .grid-2-equal, .grid-4 { grid-template-columns: 1fr; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: calc(-1 * var(--sidebar-w));
        top: 0; bottom: 0;
        width: var(--sidebar-w);
        z-index: 100;
        transition: left var(--duration-normal) var(--ease-default);
        box-shadow: var(--shadow-2xl);
      }
      .sidebar.open { left: 0; }
      .mobile-menu { display: grid; }
      .sidebar-backdrop.open {
        display: block; position: fixed; inset: 0;
        background: var(--color-overlay);
        z-index: 99;
        animation: fadeIn 0.2s var(--ease-default);
      }
    }
    @media (max-width: 640px) {
      .content { padding: var(--space-4); }
      .topbar { padding: 0 var(--space-4); gap: var(--space-2); }
      .page-title { font-size: var(--text-2xl); }
      .kpi-value { font-size: var(--text-2xl); }
      .modal { max-height: 95vh; }
      .topbar-actions .btn { padding: 6px 10px; font-size: var(--text-xs); }
      .topbar-actions .btn svg { width: 14px; height: 14px; }
      .kpi { padding: var(--space-4); }
    }

    /* =================================================================
       AUTH SCREENS
       ================================================================= */
    .auth-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--color-bg);
    }
    .auth-side {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      color: white;
      padding: var(--space-12);
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    .auth-side::before {
      content: ""; position: absolute; top: -10%; right: -10%;
      width: 400px; height: 400px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .auth-side::after {
      content: ""; position: absolute; bottom: -20%; left: -10%;
      width: 500px; height: 500px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .auth-side-content { position: relative; z-index: 1; }
    .auth-side h1 { font-size: var(--text-4xl); font-weight: 800; margin-bottom: var(--space-3); }
    .auth-side p { font-size: var(--text-base); opacity: 0.9; line-height: 1.6; max-width: 380px; }
    .auth-features { position: relative; z-index: 1; display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-8); }
    .auth-feature { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); }
    .auth-feature-icon { width: 32px; height: 32px; border-radius: var(--radius-md); background: rgba(255,255,255,0.2); display: grid; place-items: center; flex-shrink: 0; }
    .auth-feature-icon svg { width: 16px; height: 16px; }
    .auth-stats { position: relative; z-index: 1; display: flex; gap: var(--space-8); margin-top: var(--space-8); }
    .auth-stat-num { font-size: var(--text-3xl); font-weight: 800; }
    .auth-stat-label { font-size: var(--text-xs); opacity: 0.85; }

    .auth-form-wrap {
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-8);
    }
    .auth-form {
      width: 100%; max-width: 420px;
    }
    .auth-logo { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8); }
    .auth-logo-box { width: 40px; height: 40px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); display: grid; place-items: center; color: white; font-weight: 800; }
    .auth-title { font-size: var(--text-3xl); font-weight: 700; margin-bottom: var(--space-2); }
    .auth-subtitle { color: var(--color-text-muted); margin-bottom: var(--space-6); font-size: var(--text-sm); }
    .auth-fields { display: flex; flex-direction: column; gap: var(--space-4); }
    .auth-row { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-sm); }
    .auth-link { color: var(--color-primary); font-weight: 500; cursor: pointer; }
    .auth-link:hover { text-decoration: underline; }
    .auth-divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-6) 0; color: var(--color-text-muted); font-size: var(--text-xs); }
    .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
    .auth-social { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .auth-social-btn { display: flex; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-surface); border: var(--border-thin); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; color: var(--color-text); transition: all var(--duration-fast) var(--ease-default); }
    .auth-social-btn:hover { background: var(--color-surface-2); }
    .auth-social-btn svg { width: 18px; height: 18px; }
    .auth-footer { text-align: center; font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-6); }
    .auth-password-strength { display: flex; gap: 4px; margin-top: var(--space-1); }
    .auth-pwd-bar { flex: 1; height: 4px; background: var(--color-surface-3); border-radius: 2px; transition: background var(--duration-fast); }
    .auth-pwd-bar.weak { background: var(--color-danger); }
    .auth-pwd-bar.fair { background: var(--color-warning); }
    .auth-pwd-bar.strong { background: var(--color-success); }

    @media (max-width: 900px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-side { display: none; }
      .auth-form-wrap { padding: var(--space-4); }
    }

    /* =================================================================
       MODAL (custom — replaces native confirm/alert/select)
       ================================================================= */
    .modal-overlay {
      position: fixed; inset: 0;
      background: var(--color-overlay);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: var(--space-4);
      animation: fadeIn 0.2s var(--ease-default);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-2xl);
      width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto;
      animation: modalIn 0.25s var(--ease-spring);
    }
    .modal.modal-sm { max-width: 380px; }
    .modal.modal-lg { max-width: 720px; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header {
      padding: var(--space-5) var(--space-6);
      border-bottom: var(--border-thin);
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-3);
    }
    .modal-title { font-size: var(--text-lg); font-weight: 600; margin: 0; }
    .modal-body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
    .modal-footer {
      padding: var(--space-4) var(--space-6);
      border-top: var(--border-thin);
      display: flex; gap: var(--space-2); justify-content: flex-end;
      background: var(--color-surface-2);
      border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
      flex-wrap: wrap;
    }
    .modal-icon { width: 48px; height: 48px; border-radius: var(--radius-full); display: grid; place-items: center; margin: 0 auto var(--space-3); }
    .modal-icon svg { width: 24px; height: 24px; }
    .modal-icon-success { background: var(--color-success-soft); color: var(--color-success); }
    .modal-icon-danger  { background: var(--color-danger-soft);  color: var(--color-danger); }
    .modal-icon-warning { background: var(--color-warning-soft); color: var(--color-warning); }
    .modal-icon-info    { background: var(--color-info-soft);    color: var(--color-info); }
    .modal-text-center { text-align: center; }

    .type-toggle { display: flex; gap: var(--space-2); }
    .type-toggle button {
      flex: 1; padding: var(--space-3);
      border: 2px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text);
      border-radius: var(--radius-md);
      font-weight: 600; font-size: var(--text-sm);
      cursor: pointer; transition: all var(--duration-fast) var(--ease-default);
    }
    .type-toggle button.active.income { border-color: var(--color-success); background: var(--color-success-soft); color: var(--color-success); }
    .type-toggle button.active.expense { border-color: var(--color-danger); background: var(--color-danger-soft); color: var(--color-danger); }

    .color-picker { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      cursor: pointer; border: 2px solid transparent;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .color-swatch.active { border-color: var(--color-text); transform: scale(1.1); }

    /* Toast */
    .toast-container { position: fixed; top: var(--space-5); right: var(--space-5); z-index: 300; display: flex; flex-direction: column; gap: var(--space-2); max-width: 360px; }
    .toast {
      background: var(--color-surface); color: var(--color-text);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      border-left: 4px solid var(--color-success);
      display: flex; align-items: center; gap: var(--space-2);
      font-size: var(--text-sm); font-weight: 500;
      animation: toastIn 0.3s var(--ease-spring);
    }
    .toast.danger { border-color: var(--color-danger); }
    .toast.info { border-color: var(--color-info); }
    .toast.warning { border-color: var(--color-warning); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

    /* =================================================================
       EXPENSE TRACKER additions
       ================================================================= */
    .amount-income { color: var(--color-success); font-weight: 600; }
    .amount-expense { color: var(--color-danger); font-weight: 600; }
    .cat-icon {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
    }
    .cat-icon-lg { width: 48px; height: 48px; font-size: 22px; border-radius: var(--radius-lg); }
    .tag { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600; }
    .tag-income { background: var(--color-success-soft); color: var(--color-success); }
    .tag-expense { background: var(--color-danger-soft); color: var(--color-danger); }

    .wallet-card {
      background: var(--color-surface); border: var(--border-thin);
      border-radius: var(--radius-xl); padding: var(--space-5);
      box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .wallet-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .wallet-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    }
    .wallet-card.w-cash::before    { background: linear-gradient(90deg, #10B981, #059669); }
    .wallet-card.w-bank::before    { background: linear-gradient(90deg, #6366F1, #4F46E5); }
    .wallet-card.w-card::before    { background: linear-gradient(90deg, #EC4899, #DB2777); }
    .wallet-card.w-mobile::before  { background: linear-gradient(90deg, #F59E0B, #D97706); }
    .wallet-name { font-size: var(--text-sm); color: var(--color-text-muted); margin: 0 0 4px; }
    .wallet-balance { font-size: var(--text-2xl); font-weight: 700; letter-spacing: var(--tracking-tight); margin: 0; }
    .wallet-meta { display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-3);font-size:var(--text-xs);color:var(--color-text-muted); }

    .category-card {
      background: var(--color-surface); border: var(--border-thin);
      border-radius: var(--radius-xl); padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      transition: all var(--duration-fast) var(--ease-default);
      cursor: pointer;
    }
    .category-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--color-primary); }
    .category-card-top { display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3); }
    .category-card-name { font-weight: 600; margin: 0; }
    .category-card-count { font-size: var(--text-xs); color: var(--color-text-muted); }
    .category-card-amount { font-size: var(--text-lg); font-weight: 700; }

    .budget-card {
      background: var(--color-surface); border: var(--border-thin);
      border-radius: var(--radius-xl); padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .budget-card-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3); }
    .budget-card-info { display:flex;align-items:center;gap:var(--space-3); }
    .budget-card-name { font-weight: 600; margin: 0; }
    .budget-card-period { font-size: var(--text-xs); color: var(--color-text-muted); }
    .budget-amounts { display:flex;justify-content:space-between;font-size:var(--text-xs);margin-bottom:6px; }
    .budget-amounts .spent { color: var(--color-text); font-weight: 600; }
    .budget-amounts .total { color: var(--color-text-muted); }

    .stat-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: var(--space-3) 0; border-bottom: var(--border-thin); gap: var(--space-3); }
    .stat-row:last-child { border-bottom: none; }
    .stat-name { font-size: var(--text-sm); font-weight: 500; }
    .stat-value { font-size: var(--text-sm); font-weight: 600; text-align: right; }

    .customers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .customer-card {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      text-align: center;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .customer-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .customer-card .avatar { margin: 0 auto var(--space-3); }
    .customer-name { font-weight: 600; margin: 0; }
    .customer-role { font-size: var(--text-xs); color: var(--color-text-muted); margin: 2px 0 var(--space-4); }
    .customer-stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: var(--space-3) 0; border-top: var(--border-thin); border-bottom: var(--border-thin); margin-bottom: var(--space-4); }
    .customer-stat .v { font-weight: 700; }
    .customer-stat .l { font-size: var(--text-xs); color: var(--color-text-muted); }

    .notif-list { display: flex; flex-direction: column; }
    .notif {
      display: flex; align-items: flex-start; gap: var(--space-3);
      padding: var(--space-4) var(--space-6);
      border-bottom: var(--border-thin);
      transition: background var(--duration-fast) var(--ease-default);
      position: relative;
    }
    .notif:last-child { border-bottom: none; }
    .notif:hover { background: var(--color-surface-2); }
    .notif.unread::before { content: ""; position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-primary); }
    .notif-icon {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .notif-icon svg { width: 16px; height: 16px; }
    .notif-content { flex: 1; }
    .notif-title { font-weight: 600; font-size: var(--text-sm); margin: 0 0 2px; }
    .notif-desc { color: var(--color-text-muted); font-size: var(--text-sm); margin: 0; }
    .notif-time { font-size: var(--text-xs); color: var(--color-text-subtle); margin-top: 4px; }

    .settings-layout { display: grid; grid-template-columns: 220px 1fr; gap: var(--space-6); }
    @media (max-width: 900px) { .settings-layout { grid-template-columns: 1fr; } }
    .settings-nav { display: flex; flex-direction: column; gap: 2px; }
    .settings-nav button {
      text-align: left; padding: var(--space-2) var(--space-3);
      background: transparent; border: none; border-radius: var(--radius-md);
      font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 500;
      transition: all var(--duration-fast) var(--ease-default);
      display: flex; align-items: center; gap: var(--space-2);
    }
    .settings-nav button:hover { background: var(--color-surface-2); color: var(--color-text); }
    .settings-nav button.active { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
    .settings-nav svg { width: 16px; height: 16px; }
    .settings-section { display: none; }
    .settings-section.active { display: block; }
    .settings-card { padding: var(--space-5) var(--space-6); }
    .settings-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) 0; border-bottom: var(--border-thin); gap: var(--space-4); flex-wrap: wrap; }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-info { flex: 1; min-width: 200px; }
    .settings-row-label { font-weight: 500; font-size: var(--text-sm); }
    .settings-row-hint { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }

    /* =================================================================
       SAVINGS GOALS
       ================================================================= */
    .goal-card {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .goal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .goal-card::after {
      content: ""; position: absolute; top: 0; right: 0; width: 80px; height: 80px;
      background: radial-gradient(circle at top right, var(--color-primary-soft), transparent 70%);
      pointer-events: none;
    }
    .goal-card-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-3); position: relative; z-index: 1; }
    .goal-card-title { font-weight: 600; font-size: var(--text-base); margin: 0; }
    .goal-card-deadline { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; display: inline-flex; align-items: center; gap: 4px; }
    .goal-card-amounts { display: flex; align-items: baseline; gap: 4px; margin-bottom: 6px; }
    .goal-card-current { font-size: var(--text-2xl); font-weight: 700; }
    .goal-card-target { font-size: var(--text-sm); color: var(--color-text-muted); }
    .goal-card-bar { margin-top: var(--space-2); }
    .goal-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-3); font-size: var(--text-xs); color: var(--color-text-muted); position: relative; z-index: 1; }
    .goal-card-actions { display: flex; gap: var(--space-1); }
    .goal-card.completed { border-color: var(--color-success); }
    .goal-card.completed::after { background: radial-gradient(circle at top right, var(--color-success-soft), transparent 70%); }
    .goal-card.overdue { border-color: var(--color-danger); }

    /* =================================================================
       FAMILY MANAGEMENT
       ================================================================= */
    .family-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-4); }
    .family-card {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      transition: all var(--duration-fast) var(--ease-default);
    }
    .family-card:hover { box-shadow: var(--shadow-md); }
    .family-card-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .family-card-name { font-weight: 600; }
    .family-card-role { font-size: var(--text-xs); color: var(--color-text-muted); }
    .family-card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); padding-top: var(--space-3); border-top: var(--border-thin); }
    .family-card-stat .v { font-size: var(--text-lg); font-weight: 700; }
    .family-card-stat .l { font-size: var(--text-xs); color: var(--color-text-muted); }
    .family-card-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }

    .role-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
    .role-admin { background: var(--color-accent-soft); color: var(--color-accent); }
    .role-member { background: var(--color-primary-soft); color: var(--color-primary); }
    .role-child { background: var(--color-info-soft); color: var(--color-info); }
    .role-viewer { background: var(--color-surface-2); color: var(--color-text-muted); }

    /* =================================================================
       PRICING / SUBSCRIPTION
       ================================================================= */
    .pricing-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
    @media (max-width: 1100px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .pricing-grid { grid-template-columns: 1fr; } }
    .plan-card {
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-2xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column;
      transition: all var(--duration-fast) var(--ease-default);
      position: relative;
    }
    .plan-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .plan-card.featured {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px var(--color-primary-soft), var(--shadow-md);
    }
    .plan-badge {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: var(--color-primary); color: var(--color-primary-fg);
      padding: 2px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600;
    }
    .plan-name { font-size: var(--text-base); font-weight: 600; color: var(--color-text-muted); }
    .plan-price { display: flex; align-items: baseline; gap: 4px; margin: var(--space-3) 0; }
    .plan-price-amount { font-size: var(--text-4xl); font-weight: 800; letter-spacing: var(--tracking-tight); }
    .plan-price-period { font-size: var(--text-sm); color: var(--color-text-muted); }
    .plan-desc { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-4); }
    .plan-features { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-6); flex: 1; }
    .plan-feature { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--text-sm); }
    .plan-feature svg { width: 16px; height: 16px; color: var(--color-success); flex-shrink: 0; margin-top: 2px; }
    .plan-feature.disabled { color: var(--color-text-subtle); }
    .plan-feature.disabled svg { color: var(--color-text-subtle); }

    .plan-current { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); background: var(--color-success-soft); color: var(--color-success); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-3); }

    /* Billing toggle */
    .billing-toggle { display: inline-flex; align-items: center; gap: var(--space-3); padding: 4px 12px 4px 4px; background: var(--color-surface-2); border-radius: var(--radius-full); border: var(--border-thin); margin: 0 auto var(--space-6); }
    .billing-toggle button { border: none; background: transparent; padding: 6px 12px; border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); }
    .billing-toggle button.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }
    .billing-toggle .save-tag { background: var(--color-success); color: white; font-size: 10px; padding: 2px 8px; border-radius: var(--radius-full); font-weight: 700; margin-left: 4px; }
    .billing-toggle-wrap { display: flex; justify-content: center; }

    /* =================================================================
       PAYMENT METHOD
       ================================================================= */
    .payment-methods { display: flex; flex-direction: column; gap: var(--space-3); }
    .payment-method {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-4);
      background: var(--color-surface);
      border: var(--border-thin);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-default);
    }
    .payment-method:hover { border-color: var(--color-border-strong); }
    .payment-method.active { border-color: var(--color-primary); background: var(--color-primary-soft); }
    .payment-method-icon { width: 44px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center; color: white; font-weight: 700; font-size: var(--text-xs); flex-shrink: 0; }
    .payment-method-info { flex: 1; }
    .payment-method-name { font-weight: 600; font-size: var(--text-sm); }
    .payment-method-desc { font-size: var(--text-xs); color: var(--color-text-muted); }

    .card-preview {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .card-preview::before {
      content: ""; position: absolute; top: -30%; right: -10%;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .card-preview-row { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .card-preview-chip { width: 40px; height: 28px; background: linear-gradient(135deg, #FCD34D, #F59E0B); border-radius: 4px; }
    .card-preview-brand { font-size: var(--text-lg); font-weight: 700; font-style: italic; }
    .card-preview-number { font-family: var(--font-mono); font-size: var(--text-xl); letter-spacing: 0.1em; margin: var(--space-6) 0 var(--space-4); position: relative; z-index: 1; }
    .card-preview-bottom { display: flex; justify-content: space-between; position: relative; z-index: 1; }
    .card-preview-label { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.1em; }
    .card-preview-value { font-size: var(--text-sm); font-weight: 600; }

    /* =================================================================
       ADMIN
       ================================================================= */
    .admin-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
      background: var(--color-bg);
    }
    .admin-sidebar {
      background: #0F172A;
      color: #E2E8F0;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }
    [data-theme="dark"] .admin-sidebar { background: #050509; }
    .admin-sidebar-header { padding: var(--space-5); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: var(--space-3); }
    .admin-logo { width: 36px; height: 36px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); display: grid; place-items: center; font-weight: 800; color: white; }
    .admin-brand { font-weight: 700; }
    .admin-tag { font-size: var(--text-xs); opacity: 0.6; }
    .admin-nav { flex: 1; padding: var(--space-3); overflow-y: auto; }
    .admin-nav-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: rgba(255,255,255,0.7);
      font-size: var(--text-sm); font-weight: 500;
      cursor: pointer; transition: all var(--duration-fast) var(--ease-default);
      border: none; background: transparent; width: 100%; text-align: left;
    }
    .admin-nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .admin-nav-item.active { background: var(--color-primary); color: white; }
    .admin-nav-item svg { width: 18px; height: 18px; }
    .admin-nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); padding: var(--space-3) var(--space-3) var(--space-1); font-weight: 600; }
    .admin-sidebar-footer { padding: var(--space-4); border-top: 1px solid rgba(255,255,255,0.1); }
    .admin-main { display: flex; flex-direction: column; }
    .admin-topbar { height: 64px; background: var(--color-surface); border-bottom: var(--border-thin); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); position: sticky; top: 0; z-index: 30; }
    .admin-content { padding: var(--space-6) var(--space-8); max-width: 1600px; width: 100%; margin: 0 auto; }
    .admin-stat-card { background: var(--color-surface); border: var(--border-thin); border-radius: var(--radius-xl); padding: var(--space-5); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: var(--space-4); }
    .admin-stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; flex-shrink: 0; }
    .admin-stat-icon svg { width: 22px; height: 22px; }
    .admin-stat-icon-primary { background: var(--color-primary-soft); color: var(--color-primary); }
    .admin-stat-icon-success { background: var(--color-success-soft); color: var(--color-success); }
    .admin-stat-icon-warning { background: var(--color-warning-soft); color: var(--color-warning); }
    .admin-stat-icon-danger  { background: var(--color-danger-soft); color: var(--color-danger); }
    .admin-stat-value { font-size: var(--text-2xl); font-weight: 700; }
    .admin-stat-label { font-size: var(--text-xs); color: var(--color-text-muted); }

  // ====================================================================

  function buildSelects(root) {
    (root || document).querySelectorAll('[data-select]').forEach(el => {
      if (el.dataset.selectBuilt) return;
      el.dataset.selectBuilt = '1';
      const options = JSON.parse(el.dataset.selectOptions || '[]');
      const current = el.dataset.selectValue || (options[0] && options[0].value);
      el.innerHTML = '';
      el.classList.add('select-wrap');
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'select-trigger';
      const currentOpt = options.find(o => o.value === current) || options[0];
      trigger.innerHTML = `<span class="select-label">${currentOpt ? currentOpt.label : '—'}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
      const menu = document.createElement('div');
      menu.className = 'select-menu';
      menu.innerHTML = options.map(o => `<div class="select-option ${o.value === current ? 'selected' : ''}" data-value="${escapeAttr(o.value)}">${o.icon ? `<span class="opt-icon">${o.icon}</span>` : ''}<span>${o.label}</span></div>`).join('');
      el.appendChild(trigger);
      el.appendChild(menu);
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.select-wrap .select-menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
        document.querySelectorAll('.select-wrap .select-trigger.open').forEach(t => { if (t !== trigger) t.classList.remove('open'); });
        menu.classList.toggle('open');
        trigger.classList.toggle('open');
      });

        const opt = e.target.closest('.select-option');
        if (!opt) return;
        const val = opt.dataset.value;
        const found = options.find(o => o.value === val);
        menu.querySelectorAll('.select-option').forEach(x => x.classList.remove('selected'));
        opt.classList.add('selected');
        trigger.querySelector('.select-label').innerHTML = (found.icon ? `<span class="opt-icon">${found.icon}</span> ` : '') + found.label;
        el.dataset.selectValue = val;
        menu.classList.remove('open');
        trigger.classList.remove('open');
        const changeEvent = new CustomEvent('select-change', { detail: { value: val, el: el } });
        el.dispatchEvent(changeEvent);
        if (el.dataset.onchange) {
          try { new Function('value', el.dataset.onchange)(val); } catch (e) { console.error(e); }
        }
      });
    });
  }
  // Close selects when clicking outside
  document.addEventListener('click', () => {
    document.querySelectorAll('.select-wrap .select-menu.open').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.select-wrap .select-trigger.open').forEach(t => t.classList.remove('open'));
  });
  function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
  function setSelectValue(wrapEl, val) {
    if (!wrapEl) return;
    wrapEl.dataset.selectValue = val;
    const opt = wrapEl.querySelector(`.select-option[data-value="${escapeAttr(val)}"]`);
    if (!opt) return;
    wrapEl.querySelectorAll('.select-option').forEach(x => x.classList.remove('selected'));
    opt.classList.add('selected');
    const label = opt.textContent.trim();
    const trigger = wrapEl.querySelector('.select-trigger .select-label');
    if (trigger) trigger.innerHTML = label;
  }

  let confirmCallback = null;
  function openModal(modalId) {
    $('#modal-overlay').classList.add('open');

  function closeModal() {
    $('#modal-overlay').classList.remove('open');
    state.editingTxId = null;
    state.editingBudgetId = null;

  function customConfirm(opts) {
    return new Promise((resolve) => {
      $('#confirmTitle').textContent = opts.title || 'Are you sure?';
      $('#confirmMessage').textContent = opts.message || '';
      $('#confirmActionText').textContent = opts.action || 'Confirm';
      const btn = $('#confirmAction');
      btn.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
      const iconWrap = $('#confirmIconWrap');
      iconWrap.className = 'modal-icon ' + (opts.danger ? 'modal-icon-danger' : 'modal-icon-warning');
      $('#confirmIcon').innerHTML = opts.danger
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
      confirmCallback = () => { closeModal(); resolve(true); };
      openModal('modal-confirm');
    });
  }
  function customAlert(opts) {
    return new Promise((resolve) => {
      $('#confirmTitle').textContent = opts.title || 'Notice';
      $('#confirmMessage').textContent = opts.message || '';
      $('#confirmActionText').textContent = opts.action || 'OK';
      const iconWrap = $('#confirmIconWrap');
      iconWrap.className = 'modal-icon ' + (opts.type === 'success' ? 'modal-icon-success' : opts.type === 'danger' ? 'modal-icon-danger' : 'modal-icon-info');
      $('#confirmIcon').innerHTML = opts.type === 'success'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      confirmCallback = () => { closeModal(); resolve(true); };
      // Hide cancel button for alerts
      const cancelBtn = $('#alertCancelBtn');
      if (cancelBtn) cancelBtn.style.display = 'none';
      openModal('modal-confirm');
    });
  }

  function renderApp() {

    if (state.session.isAdmin) {
      root.innerHTML = renderAdminShell();

      root.innerHTML = renderAppShell();
    } else {
      root.innerHTML = renderAuthShell();
    }
    buildSelects(root);
    bindGlobalEvents();
    if (state.session.currentUserId && !state.session.isAdmin) {

      renderAdminAll();
    }
  }

  function handleLogin(email, password) {
    const user = state.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
    if (!user) {
      toast('Invalid email or password', 'danger');
      return false;
    }
    if (user.status === 'banned') {
      toast('Your account has been suspended. Contact support@moneybag.app', 'danger');
      return false;
    }
    state.session.currentUserId = user.id;
    state.session.isAdmin = user.role === 'admin';
    saveState();
    toast(`Welcome back, ${user.name.split(' ')[0]}!`, 'success');
    renderApp();
    return true;
  }
  function handleSignup(name, email, password) {
    if (state.users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
      toast('Email already registered', 'danger');
      return false;
    }
    if (password.length < 8) {
      toast('Password must be at least 8 characters', 'danger');
      return false;
    }
    const id = Date.now();
    state.users.push({
      id, name, email, password, role: 'user',
      joined: TODAY, lastActive: TODAY + ' 00:00', status: 'active', plan: 'free', familyId: null
    });
    state.session.currentUserId = id;
    state.session.isAdmin = false;
    saveState();
    toast('Account created! Welcome to MoneyBag 🎉', 'success');
    renderApp();
    return true;
  }
  function handleLogout() {
    customConfirm({
      title: 'Log out?',
      message: 'You can sign back in any time.',
      action: 'Log out',
      danger: false
    }).then(yes => {
      if (!yes) return;
      state.session.currentUserId = null;
      state.session.isAdmin = false;
      saveState();
      toast('Signed out', 'info');
      renderApp();
    });
  }
  function handleForgot(email) {
    const user = state.users.find(u => u.email.toLowerCase() === email.toLowerCase());

  function togglePwd(id, eye) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; eye.style.color = 'var(--color-primary)'; }

  function updatePwdStrength(pwd) {
    const bars = document.querySelectorAll('#pwdStrength .auth-pwd-bar');
    let score = 0;
    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    const cls = score <= 1 ? 'weak' : score === 2 ? 'fair' : 'strong';
    const labels = ['Too weak', 'Weak', 'Fair', 'Good', 'Strong'];
    bars.forEach((b, i) => {
      b.classList.remove('weak', 'fair', 'strong');
      if (i < score) b.classList.add(cls);
    });
    const hint = $('#pwdHint');
    if (hint) hint.textContent = pwd.length === 0 ? 'Use 8+ characters with letters, numbers & symbols' : `Strength: ${labels[score]}`;
  }

  function getGreeting(name) {
    const h = new Date(TODAY).getHours();
    const first = name.split(' ')[0];
    if (h < 12) return `Good morning, ${first} 👋`;
    if (h < 18) return `Good afternoon, ${first} 👋`;
    return `Good evening, ${first} 👋`;
  }

  function renderOverviewKpis() {

  function submitGoal() {
    const id = document.getElementById('goalId').value;
    const title = document.getElementById('goalTitle').value.trim();
    const target = parseFloat(document.getElementById('goalTarget').value);
    const current = parseFloat(document.getElementById('goalCurrent').value) || 0;
    const deadline = document.getElementById('goalDeadline').value;
    const icon = document.getElementById('goalIcon').value || '🎯';
    const colorEl = document.querySelector('#goalColorPalette .color-swatch.active');
    const color = colorEl ? colorEl.dataset.color : '#6366F1';
    if (!title || !target || !deadline) { toast('Title, target amount and deadline are required', 'danger'); return; }
    if (id) {
      const g = state.goals.find(x => x.id === Number(id));
      Object.assign(g, { title, targetAmount: target, currentAmount: current, deadline, icon, color });
      toast('Goal updated', 'success');
    } else {
      state.goals.push({ id: Date.now(), title, targetAmount: target, currentAmount: current, deadline, icon, color, createdAt: today() });
      toast('Savings goal created 🎯', 'success');
    }
    closeModal();
    saveState();
    renderAll();
  }
  function editGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (g) openGoalModal(g);
  }
  function deleteGoal(id) {
    customConfirm({ title: 'Delete savings goal?', message: 'This cannot be undone.', action: 'Delete', danger: true }).then(yes => {
      if (!yes) return;
      state.goals = state.goals.filter(g => g.id !== id);
      state.contributions = (state.contributions || []).filter(c => c.goalId !== id);
      toast('Goal deleted', 'danger');
      saveState();
      renderAll();
    });
  }
  function contributeToGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const remaining = g.targetAmount - g.currentAmount;
    const defaultAmt = Math.max(100, Math.round(remaining * 0.1));
    const input = window.prompt('Contribution amount', String(defaultAmt));
    if (!input) return;
    const amt = parseFloat(input);
    if (!amt || amt <= 0) { toast('Enter a valid amount', 'danger'); return; }
    g.currentAmount = Math.min(g.targetAmount, g.currentAmount + amt);
    state.contributions = state.contributions || [];
    state.contributions.push({ id: Date.now(), goalId: id, amount: amt, date: today(), note: 'Quick contribution' });
    toast(`Added ${fmt(amt)} to "${g.title}"`, 'success');
    saveState();
    renderAll();
  }

          <div class="kpi-value">${overall}%</div>

        <div class="kpi">

    }

      return `
        <div class="goal-card ${done ? 'completed' : ''} ${overdue ? 'overdue' : ''}">

              </button>

  function renderCategories() {
