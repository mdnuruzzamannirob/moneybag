    const sortedUsage = Object.entries(usage).sort((a, b) => b[1] - a[1]);
    if (sortedUsage.length) {
      document.getElementById('mostUsedCat').textContent = sortedUsage[0][0];
      document.getElementById('mostUsedCount').textContent = sortedUsage[0][1] + ' transactions';
    }
    const spending = {};
    state.transactions.filter(t => t.type === 'expense').forEach(t => spending[t.category] = (spending[t.category] || 0) + t.amount);
    const sortedSpend = Object.entries(spending).sort((a, b) => b[1] - a[1]);
    if (sortedSpend.length) {
      document.getElementById('topSpender').textContent = sortedSpend[0][0];
      document.getElementById('topSpenderAmount').textContent = fmt(sortedSpend[0][1]) + ' spent';
    }

  // PRICING
  let currentBilling = 'monthly';
  function renderPricing() {
    const grid = document.getElementById('pricingGrid');
    if (!grid) return;
    const u = getCurrentUser();
    grid.innerHTML = state.subscriptions.plans.map(p => {
      // Determine best price for current billing toggle
      let price = 0;
      let period = '';
      let showPrice = true;
      if (p.id === 'lifetime') {
        // Lifetime plan always shows its own one-time price
        price = p.priceLifetime;
        period = 'one-time';
      } else if (currentBilling === 'monthly') {
        price = p.priceMonthly;
        period = '/month';
      } else if (currentBilling === 'yearly') {
        if (p.priceYearly > 0) { price = p.priceYearly; period = '/year'; }
        else { price = p.priceMonthly * 12; period = '/year'; }
      } else {
        // lifetime toggle - show lifetime price for all paid plans
        price = p.priceLifetime || (p.priceYearly || p.priceMonthly * 12);
        period = 'one-time';
      }
      const isCurrent = u.plan === p.id;
      const isFeatured = p.featured && currentBilling === 'yearly';
      const isFree = p.id === 'free';
      return `<div class="plan-card ${isFeatured ? 'featured' : ''}">
        ${p.badge ? `<div class="plan-badge">${p.badge}</div>` : ''}
        <div class="plan-name">${p.name}</div>
        <div class="plan-price">
          <span class="plan-price-amount">${price === 0 ? 'Free' : '$' + price.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: Number.isInteger(price) ? 0 : 2 })}</span>
          ${price > 0 ? `<span class="plan-price-period">${period}</span>` : ''}
        </div>
        <div class="plan-desc">${p.id === 'free' ? 'Get started for free' : p.id === 'monthly' ? 'Perfect for individuals' : p.id === 'yearly' ? 'Best for families & power users' : 'Pay once, use forever'}</div>
        <div class="plan-features">
          ${p.features.map(f => `<div class="plan-feature ${f.included ? '' : 'disabled'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="${f.included ? '20 6 9 17 4 12' : '6 6 12 12 6 6 12 12 18 6'}"/></svg>
            <span>${f.text}</span>
          </div>`).join('')}
        </div>
        ${isCurrent ? '<div class="plan-current"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg>Your current plan</div>' : ''}
        ${isFree && !isCurrent ? `<button class="btn btn-secondary btn-block" disabled>${u.plan === 'free' ? 'Current plan' : 'Included'}</button>` :
          isCurrent ? `<button class="btn btn-secondary btn-block" disabled>Active</button>` :
          `<button class="btn ${isFeatured ? 'btn-primary' : 'btn-secondary'} btn-block" onclick="startPayment('${p.id}')">${p.id === 'lifetime' ? 'Buy lifetime' : 'Upgrade to ' + p.name}</button>`}
      </div>`;
    }).join('');
  }
  function setBilling(mode) {
    currentBilling = mode;
    document.querySelectorAll('#billingToggle button').forEach(b => b.classList.toggle('active', b.dataset.billing === mode));
    renderPricing();
  }
  function startPayment(planId) {
    const plan = state.subscriptions.plans.find(p => p.id === planId);
    if (!plan) return;
    // Determine the actual price based on plan and billing toggle
    let price = 0;
    let billingLabel = '';
    if (plan.id === 'lifetime') {
      price = plan.priceLifetime;
      billingLabel = 'Lifetime (one-time)';
    } else if (currentBilling === 'monthly') {
      price = plan.priceMonthly;
      billingLabel = 'Monthly';
    } else if (currentBilling === 'yearly') {
      price = plan.priceYearly || plan.priceMonthly * 12;
      billingLabel = 'Yearly';
    } else {
      price = plan.priceLifetime || plan.priceYearly || plan.priceMonthly * 12;
      billingLabel = 'Lifetime (one-time)';
    }
    const tax = Math.round(price * 0.05);
    const total = price + tax;
    document.getElementById('payPlanName').textContent = plan.name;
    document.getElementById('payBilling').textContent = billingLabel;
    document.getElementById('paySubtotal').textContent = '$' + price.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    document.getElementById('payTax').textContent = '$' + tax.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    document.getElementById('payTotal').textContent = '$' + total.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    document.getElementById('payButtonAmount').textContent = '$' + total.toLocaleString('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    state._pendingPlan = { planId, billing: currentBilling, price, tax, total };
    // Reset card preview
    document.getElementById('cardNumber').value = '';
    document.getElementById('cardName').value = '';
    document.getElementById('cardExp').value = '';
    document.getElementById('cardCvv').value = '';
    document.getElementById('cardPreviewNumber').textContent = '•••• •••• •••• ••••';
    document.getElementById('cardPreviewName').textContent = 'YOUR NAME';
    document.getElementById('cardPreviewExp').textContent = 'MM/YY';
    // Default payment method
    document.querySelectorAll('.payment-method').forEach(m => m.classList.toggle('active', m.dataset.method === 'card'));
    openModal('modal-payment');
  }
  function updateCardPreview() {
    const num = document.getElementById('cardNumber').value;
    const name = document.getElementById('cardName').value;
    const exp = document.getElementById('cardExp').value;
    document.getElementById('cardPreviewNumber').textContent = num ? num : '•••• •••• •••• ••••';
    document.getElementById('cardPreviewName').textContent = (name || 'YOUR NAME').toUpperCase();
    document.getElementById('cardPreviewExp').textContent = exp || 'MM/YY';
  }
  function submitPayment() {
    if (!state._pendingPlan) return;
    const activeMethod = document.querySelector('.payment-method.active');
    const method = activeMethod ? activeMethod.dataset.method : 'card';
    // Validate
    if (method === 'card') {
      const num = document.getElementById('cardNumber').value.replace(/\s/g, '');
      const name = document.getElementById('cardName').value;
      const exp = document.getElementById('cardExp').value;
      const cvv = document.getElementById('cardCvv').value;
      if (num.length < 13) { toast('Enter a valid card number', 'danger'); return; }
      if (!name) { toast('Enter cardholder name', 'danger'); return; }
      if (!/^\d{2}\/\d{2}$/.test(exp)) { toast('Enter expiry as MM/YY', 'danger'); return; }
      if (cvv.length < 3) { toast('Enter CVV', 'danger'); return; }
    }
    // Mock success
    const u = getCurrentUser();
    const p = state._pendingPlan;
    u.plan = p.planId;
    state.subscriptions.payments.push({
      id: Date.now(), userId: u.id, planId: p.planId, billing: p.billing,
      amount: p.total, method, date: TODAY, status: 'completed'
    });
    saveState();
    toast(`🎉 Payment successful! Welcome to ${state.subscriptions.plans.find(x=>x.id===p.planId).name}`, 'success');
    closeModal();
    renderApp();
  }

  // ANALYTICS
  function renderAnalytics() {
    const periodWrap = document.querySelector('#page-analytics .select-wrap');
    const period = parseInt(periodWrap ? periodWrap.dataset.selectValue : 30);
    const cutoff = new Date(TODAY);
    cutoff.setDate(cutoff.getDate() - period);
    const cutoffStr = cutoff.toISOString().split('T')[0];
    const filtered = state.transactions.filter(t => t.date >= cutoffStr);
    const income = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const savings = income > 0 ? Math.round(((income - expense) / income) * 100) : 0;
    const avgDaily = expense / period;
    document.getElementById('analyticsKpis').innerHTML = `
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Total income</span><div class="kpi-icon kpi-icon-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div></div><div class="kpi-value amount-income">${fmt(income)}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${period} days</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Total expense</span><div class="kpi-icon kpi-icon-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/></svg></div></div><div class="kpi-value amount-expense">${fmt(expense)}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${period} days</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Daily average</span><div class="kpi-icon kpi-icon-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/></svg></div></div><div class="kpi-value">${fmt(Math.round(avgDaily))}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${fmt(Math.round(avgDaily))}/day</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Savings rate</span><div class="kpi-icon kpi-icon-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/></svg></div></div><div class="kpi-value">${savings}%</div><div class="kpi-trend ${savings >= 0 ? 'kpi-trend-up' : 'kpi-trend-down'}">${savings >= 0 ? 'Saving' : 'Overspending'}</div></div>
    `;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(TODAY);
      d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      const dayTx = state.transactions.filter(t => t.date === ds);
      const inc = dayTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const exp = dayTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      days.push({ date: ds, label: d.toLocaleDateString('en-US', { weekday: 'short' }), income: inc, expense: exp });
    }
    const max = Math.max(...days.flatMap(d => [d.income, d.expense]), 1);
    document.getElementById('barChart').innerHTML = days.map(d => `<div class="bar-group">
      <div class="bar-pair">
        <div class="bar income" style="height:${(d.income / max) * 100}%" title="Income: ${fmt(d.income)}"></div>
        <div class="bar expense" style="height:${(d.expense / max) * 100}%" title="Expense: ${fmt(d.expense)}"></div>
      </div>
      <div class="bar-label">${d.label}</div>
    </div>`).join('');
    const byCat = {};
    filtered.filter(t => t.type === 'expense').forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
    const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const total = sorted.reduce((s, [_, v]) => s + v, 0) || 1;
    document.getElementById('donutTotal').textContent = fmt(total);
    const existingCircles = document.querySelectorAll('#analyticsDonut circle:not(:first-child)');
    existingCircles.forEach(c => c.remove());
    let offset = 0;
    const circumference = 2 * Math.PI * 40;
    sorted.forEach(([name, amount]) => {
      const pct = amount / total;
      const dash = pct * circumference;
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', '50');
      c.setAttribute('cy', '50');
      c.setAttribute('r', '40');
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', getCatByName(name).color);
      c.setAttribute('stroke-width', '14');
      c.setAttribute('stroke-dasharray', `${dash} ${circumference}`);
      c.setAttribute('stroke-dashoffset', -offset);
      c.setAttribute('transform', 'rotate(-90 50 50)');
      document.getElementById('analyticsDonut').appendChild(c);
      offset += dash;
    });
    document.getElementById('donutList').innerHTML = sorted.map(([name, amount]) => {
      const c = getCatByName(name);
      return `<div class="donut-list-item"><span class="swatch" style="background:${c.color}"></span><span class="name">${name}</span><span class="pct">${Math.round((amount / total) * 100)}%</span></div>`;
    }).join('') || '<div class="empty"><h3>No data</h3></div>';
    document.getElementById('dailyActivity').innerHTML = days.map(d => `<div class="stat-row">
      <div>
        <div class="stat-name">${d.label}, ${d.date.split('-').reverse().slice(0, 2).join('/')}</div>
        <div style="font-size:var(--text-xs);color:var(--color-text-muted)">${d.income ? '+' + fmt(d.income) : '—'} income · ${d.expense ? '-' + fmt(d.expense) : '—'} expense</div>
      </div>
      <div class="stat-value ${d.income - d.expense >= 0 ? 'amount-income' : 'amount-expense'}">${d.income - d.expense >= 0 ? '+' : '-'}${fmt(Math.abs(d.income - d.expense))}</div>
    </div>`).join('');
  }

  function renderNotifications() {
    const monthTx = state.transactions.filter(t => t.date.startsWith('2026-07') && t.type === 'expense');

    state.budgets.forEach(b => {
      const spent = state.transactions.filter(t => t.type === 'expense' && t.category === b.category && t.date.startsWith('2026-07')).reduce((s, t) => s + t.amount, 0);
      const pct = Math.round((spent / b.amount) * 100);
      if (pct >= 100) {

      } else if (pct >= 80) {
        notifs.push({ type: 'warning', icon: '◐', title: `${b.category} budget at ${pct}%`, desc: `${fmt(b.amount - spent)} remaining for the month.`, time: 'Today' });
      }
    });
    const largeTx = state.transactions.filter(t => t.amount > 5000 && t.type === 'expense').slice(0, 2);

  // ====================================================================
  // GLOBAL EVENTS
  // ====================================================================
  function bindGlobalEvents() {
    // Theme toggle (single icon button - works for both app + admin shells)
    const tt = document.getElementById('themeToggle');
    if (tt) tt.addEventListener('click', toggleTheme);
    // Mobile menu
    const mm = document.getElementById('mobileMenu');
    if (mm) mm.addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
      document.getElementById('sidebarBackdrop').classList.toggle('open');
    });
    // Admin mobile menu
    const amm = document.getElementById('adminMobileMenu');
    if (amm) amm.addEventListener('click', () => {
      const asb = document.getElementById('adminSidebar');
      asb.classList.toggle('open');
      const bd = document.getElementById('adminBackdrop');
      if (bd) bd.classList.toggle('open');
    });
    // Nav items
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => openPage(item.dataset.page));
    });
    // Settings nav
    document.querySelectorAll('.settings-nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.settings;
        document.querySelectorAll('.settings-nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
        document.querySelector(`[data-settings-content="${t}"]`).classList.add('active');
      });
    });
    // Tx filter tabs
    document.querySelectorAll('#txFilterTabs button').forEach(b => {
      b.addEventListener('click', () => setTxFilter(b.dataset.filter, b));
    });
    // Color picker
    document.querySelectorAll('.color-swatch').forEach(s => {
      s.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
      });
    });
    // Payment methods
    document.querySelectorAll('.payment-method').forEach(m => {
      m.addEventListener('click', () => {
        document.querySelectorAll('.payment-method').forEach(x => x.classList.remove('active'));
        m.classList.add('active');
        m.querySelector('input').checked = true;
      });
    });
    // Billing toggle
    document.querySelectorAll('#billingToggle button').forEach(b => {
      b.addEventListener('click', () => setBilling(b.dataset.billing));
    });
    // Keyboard
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (state.session.currentUserId && !state.session.isAdmin) {
          openTxModal();
        }
      }
      if (e.key === 'Escape') {
        if (document.getElementById('modal-overlay').classList.contains('open')) closeModal();
      }
    });
  }
  function openPage(name) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`[data-page="${name}"]`)?.classList.add('active');

            <tbody>${state.families.map(f => {
              const owner = state.users.find(u => u.id === f.owner);
              const memberCount = state.familyMembers.filter(m => m.familyId === f.id).length;
              const pct = Math.round((f.sharedSpend / f.monthlyLimit) * 100);
              return `<tr>
                <td><div class="cell-strong">${f.name}</div></td>
                <td><code style="background:var(--color-surface-2);padding:2px 8px;border-radius:4px;font-size:var(--text-xs)">${f.code || generateFamilyCode()}</code></td>
                <td>${owner ? owner.name : '—'}</td>
                <td>${memberCount}</td>
                <td>${fmt(f.monthlyLimit)}</td>
                <td><div style="display:flex;align-items:center;gap:8px"><span>${fmt(f.sharedSpend)}</span><span class="badge ${pct>100?'badge-danger':pct>80?'badge-warning':'badge-success'}">${pct}%</span></div></td>
                <td class="cell-muted">${dateStr(f.created)}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>
    `;
  }
  function renderAdminTransactions() {
    const total = state.transactions.reduce((s,t)=>s+t.amount,0);
    return `
      <div class="page-header">
        <div><h1 class="page-title">All Transactions</h1><p class="page-desc">${state.transactions.length} total transactions across all users.</p></div>
        <div class="page-actions"><button class="btn btn-secondary" onclick="exportData()">Export</button></div>
      </div>
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Total</span><div class="kpi-icon kpi-icon-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/></svg></div></div><div class="kpi-value">${state.transactions.length}</div><div class="kpi-trend" style="color:var(--color-text-muted)">Transactions</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Income total</span><div class="kpi-icon kpi-icon-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div></div><div class="kpi-value amount-income">${fmt(state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0))}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${state.transactions.filter(t=>t.type==='income').length} txns</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Expense total</span><div class="kpi-icon kpi-icon-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/></svg></div></div><div class="kpi-value amount-expense">${fmt(state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${state.transactions.filter(t=>t.type==='expense').length} txns</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Net flow</span><div class="kpi-icon kpi-icon-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/></svg></div></div><div class="kpi-value">${fmt(total)}</div><div class="kpi-trend ${total >= 0 ? 'kpi-trend-up' : 'kpi-trend-down'}">All users</div></div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>${state.transactions.slice(0, 30).map(t => {
              const c = getCatByName(t.category);
              return `<tr><td class="cell-muted">${dateStr(t.date)}</td><td class="cell-strong">${t.desc}</td><td>${c.icon} ${t.category}</td><td><span class="tag tag-${t.type}">${t.type}</span></td><td style="text-align:right" class="amount-${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>
    `;
  }
  function renderAdminSubscriptions() {
    const plans = state.subscriptions.plans;
    return `
      <div class="page-header">
        <div><h1 class="page-title">Subscriptions</h1><p class="page-desc">Subscription plan distribution and recent payments.</p></div>
      </div>
      <div class="admin-grid-4 mb-6">
        ${plans.map(p => {
          const count = state.users.filter(u => u.plan === p.id && u.role !== 'admin').length;
          return `<div class="kpi"><div class="kpi-header"><span class="kpi-label">${p.name}</span><div class="kpi-icon kpi-icon-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div><div class="kpi-value">${count}</div><div class="kpi-trend" style="color:var(--color-text-muted)">${p.priceMonthly > 0 ? '৳' + p.priceMonthly + '/mo' : p.priceLifetime > 0 ? '৳' + p.priceLifetime + ' once' : 'Free'}</div></div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Recent payments</h3></div>
        ${state.subscriptions.payments.length ? `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Date</th><th>User</th><th>Plan</th><th>Billing</th><th>Method</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>${state.subscriptions.payments.slice().reverse().map(p => {
              const u = state.users.find(x => x.id === p.userId);
              const plan = state.subscriptions.plans.find(x => x.id === p.planId);
              return `<tr><td class="cell-muted">${dateStr(p.date)}</td><td>${u?u.name:'—'}</td><td>${plan?plan.name:'—'}</td><td><span class="badge badge-info">${p.billing}</span></td><td>${p.method.toUpperCase()}</td><td style="text-align:right" class="amount-income">+${fmt(p.amount)}</td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>` : '<div class="empty"><h3>No payments yet</h3><p>Payments will appear here when users subscribe</p></div>'}
      </div>
    `;
  }
  function renderAdminServers() {
    const servers = [
      { name: 'API Server (us-east-1)', status: 'online', uptime: '99.98%', load: '42%', meta: 'AWS · t3.medium' },
      { name: 'Database (primary)', status: 'online', uptime: '99.99%', load: '38%', meta: 'PostgreSQL 15' },
      { name: 'Database (replica)', status: 'online', uptime: '99.99%', load: '12%', meta: 'Read replica · 2s lag' },
      { name: 'Redis Cache', status: 'online', uptime: '99.97%', load: '18%', meta: 'In-memory · 4GB' },
      { name: 'Worker Queue', status: 'warning', uptime: '99.42%', load: '78%', meta: 'BullMQ · 3 jobs pending' },
      { name: 'CDN (CloudFront)', status: 'online', uptime: '99.99%', load: '24%', meta: '12 edge locations' },
      { name: 'Email Service', status: 'online', uptime: '99.95%', load: '5%', meta: 'SendGrid' },
      { name: 'SMS Gateway (bKash)', status: 'offline', uptime: '97.20%', load: '0%', meta: 'Maintenance window' }
    ];
    return `
      <div class="page-header">
        <div><h1 class="page-title">Server Health</h1><p class="page-desc">Real-time system status.</p></div>
        <div class="page-actions"><span class="badge badge-success"><span class="dot"></span> All systems normal</span></div>
      </div>
      <div class="admin-grid-4 mb-6">
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Uptime</span><div class="kpi-icon kpi-icon-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div></div><div class="kpi-value">99.94%</div><div class="kpi-trend kpi-trend-up">30d average</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Avg response</span><div class="kpi-icon kpi-icon-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div></div><div class="kpi-value">128ms</div><div class="kpi-trend kpi-trend-up">p95 latency</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Requests/min</span><div class="kpi-icon kpi-icon-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/></svg></div></div><div class="kpi-value">2,841</div><div class="kpi-trend kpi-trend-up">+8%</div></div>
        <div class="kpi"><div class="kpi-header"><span class="kpi-label">Error rate</span><div class="kpi-icon kpi-icon-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div></div><div class="kpi-value">0.04%</div><div class="kpi-trend kpi-trend-down">Excellent</div></div>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Infrastructure</h3></div>
        <div class="card-body">
          ${servers.map(s => `<div class="server-row">
            <div><div class="server-name">${s.name}</div><div class="server-meta">${s.meta}</div></div>
            <div style="display:flex;align-items:center;gap:var(--space-4)">
              <div style="text-align:right"><div class="text-xs text-muted">Uptime</div><div class="font-semibold text-sm">${s.uptime}</div></div>
              <div style="text-align:right;min-width:60px"><div class="text-xs text-muted">Load</div><div class="font-semibold text-sm">${s.load}</div></div>
              <div class="server-status" style="color:var(--color-${s.status === 'online' ? 'success' : s.status === 'warning' ? 'warning' : 'danger'})"><span class="pulse ${s.status}"></span>${s.status.charAt(0).toUpperCase()+s.status.slice(1)}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    `;
  }
  function renderAdminSettings() {
    return `
      <div class="page-header">
        <div><h1 class="page-title">System Settings</h1><p class="page-desc">Platform-wide configuration.</p></div>
      </div>
      <div class="card settings-card">
        <h3 class="card-title" style="margin-bottom:var(--space-4)">Platform</h3>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">Maintenance mode</div><div class="settings-row-hint">Show banner to all users</div></div>
          <label class="toggle"><input type="checkbox"><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">New signups</div><div class="settings-row-hint">Allow new users to register</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">Email verification</div><div class="settings-row-hint">Require email verification on signup</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
      </div>
      <div class="card settings-card" style="margin-top:var(--space-4)">
        <h3 class="card-title" style="margin-bottom:var(--space-4)">Payment providers</h3>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">bKash</div><div class="settings-row-hint">Mobile wallet · Active</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">Nagad</div><div class="settings-row-hint">Mobile wallet · Active</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">Rocket</div><div class="settings-row-hint">DBBL mobile banking</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-row">
          <div class="settings-row-info"><div class="settings-row-label">Stripe (cards)</div><div class="settings-row-hint">International cards</div></div>
          <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
        </div>
      </div>
    `;
  }

  // ====================================================================
  // INIT
  // ====================================================================
  // Apply theme
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  // Render plan distribution in admin dashboard
  function renderAdminDashboardExtras() {
    const pd = document.getElementById('planDist');
    if (pd) {
      const counts = state.subscriptions.plans.map(p => ({ ...p, count: state.users.filter(u => u.plan === p.id && u.role !== 'admin').length }));
      const total = counts.reduce((s, p) => s + p.count, 0) || 1;
      pd.innerHTML = counts.map(p => {
        const pct = Math.round((p.count / total) * 100);
        return `<div class="stat-row"><span class="stat-name">${p.name} · ${p.count} users</span><span class="stat-value">${pct}%</span></div>
        <div class="progress mb-4"><div class="progress-bar" style="width:${pct}%"></div></div>`;
      }).join('');
    }
    const rs = document.getElementById('recentSignups');
    if (rs) {
      const recent = [...state.users].filter(u => u.role !== 'admin').sort((a, b) => new Date(b.joined) - new Date(a.joined)).slice(0, 5);
      rs.innerHTML = recent.map(u => `<div class="activity-item">
        <div class="activity-icon" style="background:var(--color-primary-soft);color:var(--color-primary)">${initials(u.name)}</div>
        <div class="activity-content">
          <div class="activity-text"><strong>${u.name}</strong> signed up</div>
          <div class="activity-time">${dateStr(u.joined)} · ${u.plan} plan</div>
        </div>
      </div>`).join('');
    }
    const rp = document.getElementById('recentPayments');
    if (rp) {
      const recent = state.subscriptions.payments.slice(-5).reverse();
      if (recent.length) {
        rp.innerHTML = recent.map(p => {
          const u = state.users.find(x => x.id === p.userId);
          return `<div class="activity-item">
            <div class="activity-icon" style="background:var(--color-success-soft);color:var(--color-success)">৳</div>
            <div class="activity-content">
              <div class="activity-text"><strong>${u?u.name:'User'}</strong> upgraded to ${p.planId}</div>
              <div class="activity-time">${dateStr(p.date)} · ${p.method}</div>
            </div>
            <div class="amount-income font-bold">+${fmt(p.amount)}</div>
          </div>`;
        }).join('');
      } else {
        rp.innerHTML = '<div class="empty"><h3>No payments yet</h3><p>Mock MRR shown on dashboard</p></div>';
      }
    }
  }
  // Patch renderAdminAll to call extras
  const _origRenderAdminAll = renderAdminAll;
  renderAdminAll = function() {
    _origRenderAdminAll();
    setTimeout(renderAdminDashboardExtras, 0);
  };

  // ============== BOOT ==============
  // If user is already logged in, render. Otherwise, show auth.
  if (state.session.currentUserId) {
    const u = getCurrentUser();
    if (!u) {
      state.session = { currentUserId: null, isAdmin: false };
      saveState();
    } else {
      state.session.isAdmin = u.role === 'admin';
    }
  }
  renderApp();
  bindAuthEvents();
  </script>
</body>
</html>
